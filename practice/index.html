<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register & Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-wrapper">
        <nav class="navbar">
            <div class="navcontainer">
                <a href="/" id="navlogo">Conjugations Digital</a>
                <div class="navtoggle" id="mobile-menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
                <ul class="navmenu">
                    <li class="navitem">
                        <a href="/classroom/" class="navlinks">Classroom</a>
                    </li>
                    <li class="navitem">
                        <a href="/practice/" class="navlinks">Practice</a>
                    </li>
                    <li class="navitem">
                        <a href="/profile/" class="navlinks">Profile</a>
                    </li>
                    <li class="navbutton">
                        <a href="/login/" class="signupbutton">Sign Up</a>
                    </li>
                </ul>
            </div>
        </nav>
        
        <!-- Actual Code -->
        <div class="main-container">
            <h1 class="practice-title">Practice Generator</h1>
            <p class="mtv-title">Modes&Tenses</p>
            <div class="mode-container" id="indicatifContainer">
                <button class="select-button" id="indicatifButton"><span>Indicatif</span></button>
                <div class="tense-container" id="indicatif">
                    <button class="select-button" id="Plus-que-parfait de l'indicatif"><span>Plus-que-parfait</span></button>
                    <button class="select-button" id="Passé antérieur de l'indicatif"><span>Passé antérieur</span></button>
                    <button class="select-button" id="Imparfait de l'indicatif"><span>Imparfait</span></button>
                    <button class="select-button" id="Passé simple de l'indicatif"><span>Passé simple</span></button>
                    <button class="select-button" id="Passé composé de l'indicatif"><span>Passé composé</span></button>
                    <button class="select-button" id="Présent de l'indicatif"><span>Présent</span></button>
                    <button class="select-button" id="Futur proche de l'indicatif"><span>Futur proche</span></button>
                    <button class="select-button" id="Futur antérieur de l'indicatif"><span>Futur antérieur</span></button>
                    <button class="select-button" id="Futur simple de l'indicatif"><span>Futur simple</span></button>
                </div>
            </div>
            <div class="mode-container" id="subjonctifContainer">
                <button class="select-button" id="subjonctifButton"><span>Subjonctif</span></button>
                <div class="tense-container" id="subjonctif">
                    <button class="select-button" id="Plus-que-parfait du subjonctif"><span>Plus-que-parfait</span></button>
                    <button class="select-button" id="Imparfait du subjonctif"><span>Imparfait</span></button>
                    <button class="select-button" id="Passé du subjonctif"><span>Passé</span></button>
                    <button class="select-button" id="Présent du subjonctif"><span>Présent</span></button>
                </div>
            </div>
            <div class="mode-container" id="conditionnelContainer">
                <button class="select-button" id="conditionnelButton"><span>Conditionnel</span></button>
                <div class="tense-container" id="conditionnel">
                    <button class="select-button" id="Passé du conditionnel"><span>Passé</span></button>
                    <button class="select-button" id="Présent du conditionnel"><span>Présent</span></button>
                </div>
            </div>
            <div class="mode-container" id="imperatifContainer">
                <button class="select-button" id="imperatifButton"><span>Impératif</span></button>
                <div class="tense-container" id="imperatif">
                    <button class="select-button" id="Passé de l'impératif"><span>Passé</span></button>
                    <button class="select-button" id="Présent de l'impératif"><span>Présent</span></button>
                </div>
            </div>
            <div class="mode-container" id="participeContainer">
                <button class="select-button" id="participeButton"><span>Participe</span></button>
                <div class="tense-container" id="participe">
                    <button class="select-button" id="Participe passé"><span>Passé</span></button>
                    <button class="select-button" id="Participe présent"><span>Présent</span></button>
                </div>
            </div>
            <p class="mtv-title">Verbs</p>
            <div class="verb-container">
                <button class="select-button" id="g1"><span>Groupe 1</span></button>
                <button class="select-button" id="g2"><span>Groupe 2</span></button>
                <button class="select-button" id="g3"><span>Groupe 3</span></button>
            </div>
            <div class="negation-container" id="negationContainer">
                <p class="negation-title">Negation</p>
                <button class="select-button" id="negation"><span>off</span></button>
            </div>
            <button class="practice-button" id="beginButton">
                <span>Start Practicing</span>
            </button>
            <button class="practice-button" id="setButton" style="display: none;">
                <span>Set Verb Tenses</span>
            </button>
            <p id="practice-question" class="practice-question-class" style="display: none;">we</p>
            <input class="practice-response-class" type="text" id="practice-response" placeholder="Conjugate the french verb here..." style="display: none;">
            <button class="practice-button" id="responseSubmit" style="display: none;">
                <span>Submit Answer</span>
            </button>
            <p id="practice-answer" class="practice-answer-class" style="display: none;"></p>
        </div>     

        <!-- Footer Section -->
        <div class="footer_container">
            <div class="footer">
                <div class="footer-wrap">
                    <a href="/" class="footer_logo">Conjugations Digital</a>
                    <a class="website-right">© Conjugations Digital 2025. All rights reserved</a>
                    <a href="https://www.coursedigital.org/" class="ext-link" target="_blank">Classes</a>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
